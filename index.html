<link rel="manifest" id="manifestLink">
<style>
:root{
  --bg:#120f16; --s1:#1b1721; --s2:#251f2d; --line:#342c3f;
  --text:#f4eee8; --mute:#a59bb0; --peach:#ffb38a; --rose:#ff6f91; --mint:#7be0b5; --sky:#8ab4ff; --amber:#ffcf6b;
  --serif: ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --round: ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
  --sans: system-ui,-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{touch-action:manipulation}
#app{min-height:100%;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  background:radial-gradient(120% 60% at 100% -10%,rgba(255,111,145,.16),transparent 60%),radial-gradient(90% 50% at -10% 0%,rgba(255,179,138,.10),transparent 60%),var(--bg)}
main{flex:1;padding:18px 18px calc(96px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto}
h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.1;margin:10px 0 6px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:600;font-size:23px;margin:26px 0 10px}
h3{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--peach);margin:0 0 8px}
p{margin:0 0 10px} .mute{color:var(--mute)} .small{font-size:14px} .center{text-align:center}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}
.card.soft{background:linear-gradient(160deg,rgba(255,111,145,.13),rgba(255,179,138,.06));border-color:rgba(255,111,145,.3)}
button,select,input{font:inherit;color:inherit}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:18px;padding:14px 18px;
  background:linear-gradient(135deg,var(--rose),var(--peach));color:#2a1016;font-weight:700;font-size:18px;cursor:pointer;margin:10px 0}
.btn:active{transform:scale(.985)} .btn[disabled]{opacity:.45}
.btn.ghost{background:var(--s2);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.sm{min-height:46px;font-size:15px;width:auto;padding:10px 16px;border-radius:14px;margin:4px 0}
.row{display:flex;gap:10px;align-items:center} .row>*{flex:1} .wrap{flex-wrap:wrap}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px;font-weight:600}
input[type=text],select{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--s2);padding:12px 14px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
input[type=text]:focus,select:focus{border-color:var(--peach)}
.chips{display:flex;flex-wrap:wrap;gap:8px} .chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:14px}
.chip b{font-family:var(--round)} .chip.on{border-color:var(--mint);color:var(--mint)}
.chk{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:15px;cursor:pointer;min-height:44px}
.chk input{display:none} .chk.sel{background:rgba(255,111,145,.18);border-color:var(--rose)}
ol.steps{margin:0;padding-left:22px} ol.steps li{margin:6px 0}
/* tuner */
.tuner{text-align:center;padding:6px 0 0}
.note{font-family:var(--round);font-weight:800;font-size:96px;line-height:1;letter-spacing:-.02em;min-height:96px}
.note small{font-size:40px;font-weight:700;color:var(--mute)}
.cents{font-family:var(--round);font-size:18px;color:var(--mute);min-height:26px}
.pill{display:inline-block;min-width:120px;padding:8px 18px;border-radius:999px;font-weight:800;font-size:18px;letter-spacing:.04em;background:var(--s2);color:var(--mute);margin-top:6px}
.pill.on{background:rgba(123,224,181,.18);color:var(--mint)} .pill.flat{background:rgba(138,180,255,.18);color:var(--sky)} .pill.sharp{background:rgba(255,207,107,.18);color:var(--amber)}
.needle{position:relative;height:14px;border-radius:999px;background:var(--s2);margin:14px 6px 4px;overflow:hidden}
.needle:before{content:"";position:absolute;left:35%;right:35%;top:0;bottom:0;background:rgba(123,224,181,.22)}
.needle i{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;border-radius:3px;background:var(--text);left:50%;transition:left .06s linear}
canvas.pitch{width:100%;height:210px;display:block;border-radius:16px;background:#0e0b12;border:1px solid var(--line);margin-top:10px}
.timer{font-family:var(--round);font-size:44px;font-weight:800;text-align:center}
.bar{height:10px;border-radius:999px;background:var(--s2);overflow:hidden} .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--peach))}
.rec{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rose);margin-right:8px;animation:pulse 1s infinite} @keyframes pulse{50%{opacity:.25}}
/* profile */
.big{font-family:var(--round);font-weight:800;font-size:30px;line-height:1.15}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)} .kv:first-of-type{border-top:0} .kv span:last-child{text-align:right;font-weight:600}
.scale{margin:14px 0 4px} .scale .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-weight:600}
.scale .track{position:relative;height:10px;border-radius:999px;background:var(--s2);margin:6px 0} .scale .track i{position:absolute;top:-5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--peach));border:3px solid var(--s1)}
.scale .val{font-weight:600}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-top:8px} .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{padding:12px 0;border-top:1px solid var(--line)} .tip:first-child{border-top:0} .tip b{display:block;margin-bottom:2px}
/* matches */
.song{background:var(--s1);border:1px solid var(--line);border-radius:18px;margin:10px 0;overflow:hidden}
.song summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;min-height:64px} .song summary::-webkit-details-marker{display:none}
.fit{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--round);font-weight:800;font-size:18px;background:conic-gradient(var(--rose) calc(var(--p)*1%),var(--s2) 0)}
.fit span{width:46px;height:46px;border-radius:50%;background:var(--s1);display:grid;place-items:center}
.song .ti{font-weight:700;line-height:1.2} .song .ar{font-size:14px;color:var(--mute)} .song .key{font-size:13px;color:var(--peach);font-weight:600;margin-top:2px}
.song .body{padding:0 14px 14px;font-size:15px} .song .body p{margin:8px 0} .song .body b{color:var(--peach)}
.tags{font-size:12.5px;color:var(--mute)}
a{color:var(--peach)}
canvas.chart{width:100%;height:230px;display:block}
/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(18,15,22,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;max-width:112px;min-height:54px;background:none;border:0;color:var(--mute);font-size:11.5px;font-weight:700;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:12px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

  return base + (m[2]==='#'?1:m[2]==='b'?-1:0) + 12*(parseInt(m[3],10)+1);

function midiToName(m){ m=Math.round(m); return NOTE_NAMES[((m%12)+12)%12] + (Math.floor(m/12)-1); }

// ---- YIN pitch detection (de Cheveigne & Kawahara 2002) ----------------
const _yinD = new Float32Array(2048);
function yin(buf, sr, fmin, fmax, thresh){
  fmin = fmin||65; fmax = fmax||1400; thresh = thresh||0.15;
  const n = buf.length;
  const tauMax = Math.min((n>>1)-1, Math.floor(sr/fmin));
  const tauMin = Math.max(2, Math.floor(sr/fmax));
  const W = n - tauMax;
  const d = _yinD;
  d[0] = 1;
  let run = 0;
  for(let tau=1; tau<=tauMax; tau++){
    let sum = 0;
    for(let i=0;i<W;i++){ const df = buf[i]-buf[i+tau]; sum += df*df; }
    run += sum;
    d[tau] = run>0 ? sum*tau/run : 1;       // cumulative mean normalized difference
  }

  for(let t=tauMin; t<=tauMax; t++){
    if(d[t] < thresh){ while(t+1<=tauMax && d[t+1]<d[t]) t++; tau = t; break; }
  }
  if(tau < 0){
    let best = tauMin;
    for(let t=tauMin; t<=tauMax; t++) if(d[t]<d[best]) best = t;
    if(d[best] > 0.4) return {f:0, conf:clamp(1-d[best],0,1), tau:0};
    tau = best;

  if(tau>1 && tau<tauMax){

    if(den>0) bt = tau + (a-c)/(2*den);

}

// ---- Harmonics-to-noise ratio from normalized autocorrelation ----------
function hnrDb(buf, tau){

// ---- Radix-2 FFT + spectral features ------------------------------------
const _fft = {n:0};
function _fftSetup(n){
  _fft.n=n; _fft.re=new Float32Array(n); _fft.im=new Float32Array(n);

  for(let i=0;i<n;i++){ re[rev[i]] = buf[i]*_fft.win[i]; im[i]=0; }

    const half=size>>1, step=n/size;
    for(let i=0;i<n;i+=size){
      for(let j=0,k=0;j<half;j++,k+=step){
        const wr=_fft.cos[k], wi=-_fft.sin[k];
        const xr=re[i+j+half]*wr - im[i+j+half]*wi, xi=re[i+j+half]*wi + im[i+j+half]*wr;
        re[i+j+half]=re[i+j]-xr; im[i+j+half]=im[i+j]-xi; re[i+j]+=xr; im[i+j]+=xi;

  for(let k=k0;k<=k1;k++){

}

// ---- One analysis frame ---------------------------------------------------
function analyzeFrame(buf, sr){
  let e=0; for(let i=0;i<buf.length;i++) e+=buf[i]*buf[i];
  const rms = Math.sqrt(e/buf.length);
  const fr = {rms:rms, f:0, conf:0, hnr:NaN, centroid:0, hf:0};
  if(rms < 0.0015) return fr;
  const y = yin(buf, sr);
  fr.f = y.f; fr.conf = y.conf;
  if(y.f>0 && y.conf>=0.7){
    fr.hnr = hnrDb(buf, y.tau);
    const sp = spectralFeatures(buf, sr);
    fr.centroid = sp.centroid; fr.hf = sp.hf;
  }

}

// ---- Frames -> cleaned pitch track ---------------------------------------
// frames: [{t, rms, f, conf, hnr, centroid, hf}]
function toTrack(frames){
  // noise floor = typical loudness of frames with no clear pitch; gate sits above it
  const noiseR=[], candR=[];
  for(const f of frames){ if(f.f>0 && f.conf>=0.8) candR.push(f.rms); else if(f.conf<0.5) noiseR.push(f.rms); }
  const noise = noiseR.length>=5 ? median(noiseR) : 0;
  const gate = Math.max(0.004, Math.min(noise*2.5, candR.length? 0.3*median(candR) : 1));
  const n = frames.length, t = new Array(n), m = new Array(n);
  for(let i=0;i<n;i++){
    const f = frames[i];
    t[i] = f.t;
    m[i] = (f.f>0 && f.conf>=0.8 && f.rms>=gate) ? hzToMidi(f.f) : NaN;
  }
  // octave-jump repair and outlier removal against nearby frames
  const out = m.slice();
  for(let i=0;i<n;i++){
    if(isNaN(m[i])) continue;
    const nb=[];
    for(let j=i-1;j>=0 && nb.length<4 && t[i]-t[j]<0.2;j--) if(!isNaN(m[j])) nb.push(m[j]);
    const left = nb.length;
    for(let j=i+1;j<n && nb.length<left+4 && t[j]-t[i]<0.2;j++) if(!isNaN(m[j])) nb.push(m[j]);
    if(nb.length<3) continue;

    else if(ad>7) out[i] = NaN;
  }

  const sm = out.slice();
  for(let i=1;i<n-1;i++){
    if(isNaN(out[i])||isNaN(out[i-1])||isNaN(out[i+1])) continue;
    sm[i] = median([out[i-1],out[i],out[i+1]]);

}

// ---- Sustained extremes: a note only counts if held >= minDur seconds ----
function sustainedExtremes(track, minDur){
  minDur = minDur||0.5;
  const t=track.t, m=track.m, n=t.length;
  let low=Infinity, high=-Infinity;
  let i=0;
  while(i<n){
    if(isNaN(m[i])){ i++; continue; }
    let j=i;                                   // contiguous voiced run (gaps <= 0.12 s)
    let lastV=i;
    for(let k=i+1;k<n;k++){
      if(!isNaN(m[k])){ if(t[k]-t[lastV]>0.12) break; lastV=k; }
      else if(t[k]-t[lastV]>0.12) break;
      j=k;
    }
    j=lastV;
    let a=i;
    for(let b=i;b<=j;b++){
      while(t[b]-t[a+1] >= minDur && a+1<b) a++;
      if(t[b]-t[a] >= minDur){
        const w=[]; for(let k=a;k<=b;k++) if(!isNaN(m[k])) w.push(m[k]);
        if(w.length>=4){
          const hiOfWin = percentile(w,0.9), loOfWin = percentile(w,0.1);
          if(hiOfWin<low) low=hiOfWin;         // stayed at/below this for minDur
          if(loOfWin>high) high=loOfWin;       // stayed at/above this for minDur
        }
      }
    }
    i=j+1;
  }
  if(!isFinite(low)||!isFinite(high)) return null;
  return {low:low, high:high};
}

// ---- Held-note segmentation ---------------------------------------------
function segmentNotes(track){
  const t=track.t, m=track.m, n=t.length, notes=[];
  let cur=null;
  function close(){ if(cur && cur.idx.length>=3){ cur.dur=t[cur.idx[cur.idx.length-1]]-t[cur.idx[0]]; notes.push(cur); } cur=null; }
  for(let i=0;i<n;i++){
    if(isNaN(m[i])){ if(cur && t[i]-t[cur.idx[cur.idx.length-1]]>0.1) close(); continue; }
    if(!cur){ cur={idx:[i]}; continue; }
    const recent = cur.idx.slice(-12).map(k=>m[k]);
    const all = cur.idx.map(k=>m[k]);
    if(Math.abs(m[i]-median(recent))>0.9 || Math.abs(m[i]-median(all))>1.5){ close(); cur={idx:[i]}; }
    else cur.idx.push(i);
  }
  close();
  return notes;
}

function resample(ts, vs, fs){
  const out=[]; if(ts.length<2) return out;

    while(j<ts.length-2 && ts[j+1]<x) j++;

    out.push(vs[j]+(vs[j+1]-vs[j])*u);

}

// Vibrato on one held note: rate (Hz), extent (+/- cents), periodicity strength
function vibratoOf(ts, vs){

  const slope=(N*sxy-sx*sy)/(N*sxx-sx*sx), icpt=(sy-slope*sx)/N;
  const r=x.map((v,i)=>v-(icpt+slope*i));

  let bestLag=0, best=-1; const acf={};
  for(let lag=11; lag<=26; lag++){
    let s=0; for(let i=0;i+lag<N;i++) s+=r[i]*r[i+lag];
    const v = s/e0*(N/(N-lag)); acf[lag]=v;
    if(v>best){ best=v; bestLag=lag; }

    const a=acf[bestLag-1], b=acf[bestLag], c=acf[bestLag+1], den=a+c-2*b;

  const edge = (bestLag===11||bestLag===26);
  const present = !edge && best>=0.45 && amp>=0.12 && (N/fs)*rate>=3;
  return {present:present, rate:rate, extent:amp*100, strength:best, x:x};
}

// ---- Full analysis of a singing take -------------------------------------
function analyzeTake(frames){

  const voicedM=[], hn=[], cen=[], hf=[], rmsV=[], conf=[];

    if(isNaN(m[i])) continue;
    voicedM.push(m[i]); rmsV.push(frames[i].rms); conf.push(frames[i].conf);
    if(!isNaN(frames[i].hnr)) hn.push(frames[i].hnr);

  }
  const notes = segmentNotes(track).filter(nt=>nt.dur>=0.35);

    for(let k=0;k<ts.length;k++){
      let ok=true, seen=false;
      for(let q=k;q<ts.length && ts[q]-ts[k]<=0.1;q++){ seen=true; if(Math.abs(vs[q]-med)>0.3){ ok=false; break; } }
      if(ok&&seen){ st=ts[k]-t0; break; }
    }
    if(st!==null) settle.push(st*1000);
  }
  const res = {
    dur: track.dur, voicedRatio: track.voicedRatio, noise: track.noise,
    meanRms: rmsV.length? mean(rmsV):0, medConf: conf.length? median(conf):0,
    voicedSeconds: track.dur*track.voicedRatio,
    p05: percentile(voicedM,0.05), p15: percentile(voicedM,0.15), p50: percentile(voicedM,0.5), p85: percentile(voicedM,0.85), p95: percentile(voicedM,0.95),
    extremes: sustainedExtremes(track,0.5),
    hnr: median(hn), centroid: median(cen), hf: median(hf),
    heldNotes: notes.length,
    accCents: accW? accSum/accW : NaN, signedCents: accW? signedSum/accW : NaN,
    settleMs: settle.length? median(settle) : NaN,
    steadyCents: steady.length? median(steady) : NaN,
    vibrato: { longNotes: longNotes, count: vibs.length,
      present: vibs.length>=2 && vibs.length>=0.3*longNotes,
      rate: vibs.length? median(vibs.map(v=>v.rate)) : NaN, extent: vibs.length? median(vibs.map(v=>v.extent)) : NaN }
  };
  return res;
}

// ---- Tone scales -----------------------------------------------------------
function brightScore(centroid, hf){
  if(!(centroid>0)) return NaN;
  const bc = clamp((centroid-1400)/600,-1,1);                       // ~800 Hz mellow ... ~2000 Hz bright
  const bh = clamp((Math.log10(Math.max(hf,1e-4))+1.4)/0.6,-1,1);   // share of energy above 2 kHz
  return clamp(0.6*bc+0.4*bh,-1,1);
}
function airScore(hnr){ if(isNaN(hnr)) return NaN; return clamp((13-hnr)/6.5,-1,1); }
function brightLabel(b){ return isNaN(b)?'not enough signal': b>0.33?'bright': b<-0.33?'warm':'balanced (between warm and bright)'; }
function airLabel(a){ return isNaN(a)?'not enough signal': a>0.33?'airy': a<-0.33?'clear':'mostly clear with a little air'; }
function steadyLabel(c){ return isNaN(c)?'not enough held notes to tell': c<12?'steady': c<25?'mostly steady':'wavering on held notes'; }

// ---- Voice type estimate ----------------------------------------------------
const VOICE_TYPES = [
  {name:'bass',        zone:46, range:52, typical:'E2 to E4'},
  {name:'baritone',    zone:52, range:57, typical:'A2 to A4'},
  {name:'tenor',       zone:58, range:60, typical:'C3 to C5'},
  {name:'alto',        zone:63, range:65, typical:'F3 to F5'},
  {name:'mezzo',       zone:67, range:69, typical:'A3 to A5'},
  {name:'soprano',     zone:71, range:72, typical:'C4 to C6'}
];
function estimateVoiceType(low, high, zlo, zhi){
  const zc=(zlo+zhi)/2, rc=(low+high)/2;
  let best=null;
  for(const v of VOICE_TYPES){
    const d = 0.6*Math.abs(zc-v.zone) + 0.4*Math.abs(rc-v.range);
    if(!best||d<best.d) best={d:d, v:v};
  }
  let name=best.v.name, typical=best.v.typical;
  // a voice that can reach well down into chest notes but lives up high in a light register
  if((name==='alto'||name==='mezzo') && low<=48 && zc>=62){ name='countertenor'; typical='G3 to E5, mostly in head voice'; }
  const reason = 'Your comfortable zone centers near '+midiToName(zc)+' and your range runs '+midiToName(low)+' to '+midiToName(high)+', which lines up most with typical '+name+' territory ('+typical+').';
  return {name:name, reason:reason};
}

// ---- Song database helpers + matching ---------------------------------------
function normStr(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function makeSong(row){
  const z = String(row[5]).split('-');
  return { title:row[0], artist:row[1], voice:row[2], lo:noteToMidi(row[3]), hi:noteToMidi(row[4]),
    zlo:noteToMidi(z[0]), zhi:noteToMidi(z[1]), tags:String(row[6]).split(',').filter(Boolean), energy:row[7], genre:row[8], src:row[9], raw:row[10]||null, custom:!!row[11] };
}
function findSong(songs, title, artist){
  const nt=normStr(title), na=normStr(artist); if(!nt) return null;
  let best=null, bs=0;
  for(const s of songs){
    const st=normStr(s.title), sa=normStr(s.artist); let sc=0;
    if(st===nt) sc=3; else if(st.indexOf(nt)>=0||nt.indexOf(st)>=0) sc=1.5; else continue;
    if(na){ const first=na.split(' ')[0]; if(sa.indexOf(na)>=0||na.indexOf(sa)>=0) sc+=2; else if(first.length>2 && sa.indexOf(first)>=0) sc+=1; else sc-=1; }
    if(sc>bs){ bs=sc; best=s; }
  }
  return bs>=1.5? best : null;
}
function tagVector(tags){
  let b=0,a=0;
  for(const g of tags){
    if(g==='warm') b-=1; else if(g==='bright') b+=1; else if(g==='breathy') a+=1;
    else if(g==='belty'){ a-=0.6; b+=0.2; } else if(g==='smooth') a-=0.2; else if(g==='raspy') a+=0.4; else if(g==='falsetto-heavy') a+=0.3;
  }
  return {b:clamp(b,-1,1), a:clamp(a,-1,1)};
}
function splitShift(s){ const oct=Math.round((s-0.5)/12); return {oct:oct, rem:s-12*oct}; }
function shiftLabel(s){
  if(s===0) return 'original key';
  const p=splitShift(s), parts=[];
  if(p.oct) parts.push((Math.abs(p.oct)===1?'one octave':Math.abs(p.oct)+' octaves')+(p.oct<0?' down':' up'));
  if(p.rem) parts.push((p.rem>0?'+':'−')+Math.abs(p.rem)+' half step'+(Math.abs(p.rem)===1?'':'s'));
  return parts.join(', then ');
}
// prof: {low, high, zlo, zhi, bright, air}
function fitAt(song, prof, s){
  const lo=song.lo+s, hi=song.hi+s;
  const overLow=Math.max(0,prof.low-lo), overHigh=Math.max(0,hi-prof.high), over=overLow+overHigh;
  const rangeFit=Math.max(0,1-over/6);
  const ov=Math.max(0,Math.min(song.zhi+s,prof.zhi)-Math.max(song.zlo+s,prof.zlo));
  const zoneFit=Math.min(1, ov/Math.max(1,Math.min(song.zhi-song.zlo, prof.zhi-prof.zlo)));
  let tone=0.5;
  if(!isNaN(prof.bright)&&!isNaN(prof.air)){ const tv=tagVector(song.tags); tone = 1-(Math.abs(prof.bright-tv.b)+Math.abs(prof.air-tv.a))/4; }
  const p=splitShift(s);
  const penalty=0.012*Math.abs(p.rem)+(p.oct?0.01:0);
  return {s:s, lo:lo, hi:hi, overLow:overLow, overHigh:overHigh, over:over, rangeFit:rangeFit, zoneFit:zoneFit, tone:tone,
    score: clamp(0.5*rangeFit+0.3*zoneFit+0.2*tone-penalty,0,1)};
}
function bestFit(song, prof){
  let best=null;
  for(let s=-18;s<=18;s++){ const f=fitAt(song,prof,s); if(!best||f.score>best.score+1e-9) best=f; }
  return best;
}
function naturalFit(song, prof){            // original key, allowing whole-octave moves only
  let best=null;
  for(const s of [0,-12,12]){ const f=fitAt(song,prof,s); if(!best||f.score>best.score+1e-9) best=f; }
  return best;
}
function rankSongs(songs, prof){
  return songs.map(sg=>({song:sg, fit:bestFit(sg,prof), nat:naturalFit(sg,prof)}))
    .sort((x,y)=>y.fit.score-x.fit.score);
}
function tagPhrase(tags){ const base=tags.filter(g=>g!=='falsetto-heavy'); return (base.length? base.join(', ')+' ':'')+'sound'+(base.length<tags.length?' with lots of falsetto':''); }
function critique(song, f, prof){
  const spare=prof.high-f.hi, spareLow=f.lo-prof.low, why=[], hard=[];
  if(f.over===0) why.push('The whole song ('+midiToName(f.lo)+' to '+midiToName(f.hi)+(f.s?' in this key':'')+') sits inside your range, with '+spare+' half step'+(spare===1?'':'s')+' to spare on top and '+spareLow+' underneath.');
  else if(f.over<=2) why.push('Nearly all of it fits: it runs '+midiToName(f.lo)+' to '+midiToName(f.hi)+(f.s?' in this key':'')+', '+f.over+' half step'+(f.over===1?'':'s')+' past your measured range.');
  else why.push('Even in its best key it runs '+midiToName(f.lo)+' to '+midiToName(f.hi)+', '+f.over+' half steps past your measured range, so parts of it will be a reach.');
  if(f.zoneFit>=0.75) why.push('Its main melody lands right in your comfortable zone.');
  else if(f.zoneFit>=0.4) why.push('A good share of its main melody overlaps your comfortable zone.');
  if(!isNaN(prof.bright)){
    const tv=tagVector(song.tags), close=1-(Math.abs(prof.bright-tv.b)+Math.abs(prof.air-tv.a))/4;
    if(close>=0.72) why.push('The original\'s '+tagPhrase(song.tags)+' is close to how your voice measured.');
  }
  if(f.hi>prof.zhi+2) hard.push('The top notes (up to '+midiToName(f.hi)+') sit '+(f.hi-prof.zhi)+' half steps above your comfortable zone. That is usually the chorus or the big moment.');
  if(f.lo<prof.zlo-2) hard.push('The lowest notes (down to '+midiToName(f.lo)+') dip '+(prof.zlo-f.lo)+' half steps under your comfortable zone, usually in the verses.');
  if(song.tags.indexOf('belty')>=0) hard.push('Long, full-voice held notes that take steady breath.');
  if(song.tags.indexOf('falsetto-heavy')>=0) hard.push('Flips between full voice and a lighter head voice or falsetto.');
  if(song.hi-song.lo>=19) hard.push('A wide span ('+(song.hi-song.lo)+' half steps), so expect big jumps between the low and high parts.');
  if(song.energy==='high' && hard.length<3) hard.push('It moves fast, so plan where you breathe.');
  if(!hard.length) hard.push('Nothing stands out. It stays close to where your voice already sits.');
  const key = f.s===0 ? 'Original key works.' : 'Try it '+shiftLabel(f.s)+' from the original ('+midiToName(f.lo)+' to '+midiToName(f.hi)+').';
  return {why:why.join(' '), hard:hard.slice(0,3).join(' '), key:key};
}
function stretchList(ranked, prof, limit){
  const out=[];
  for(const r of ranked){
    const f=r.nat;
    if(f.over>=1 && f.over<=4){
      const work=[];
      if(f.overHigh>0) work.push('Top note '+midiToName(f.hi)+' is '+f.overHigh+' half step'+(f.overHigh===1?'':'s')+' above your current highest. Work on light sirens and lip trills that glide up to it, quietly at first.');
      if(f.overLow>0) work.push('Lowest note '+midiToName(f.lo)+' is '+f.overLow+' half step'+(f.overLow===1?'':'s')+' below your current lowest. Work on relaxed descending hums, without pressing.');
      if(r.song.tags.indexOf('belty')>=0) work.push('Build up to the sustained full-voice notes a phrase at a time.');
      else if(r.song.tags.indexOf('falsetto-heavy')>=0) work.push('Practice the switch into head voice so it stays smooth.');
      out.push({song:r.song, fit:f, work:work.join(' '), rank: f.zoneFit+f.tone});
    }
  }
  out.sort((x,y)=>y.rank-x.rank);
  return out.slice(0,limit||8);
}

// ---- Song choice insight ------------------------------------------------------
function songChoiceInsight(prof, take, song, title){
  const lines=[];
  const pos=(take.p50-prof.low)/Math.max(1,prof.high-prof.low);
  const where = pos<0.35?'the lower part':pos>0.65?'the upper part':'the middle';
  lines.push('You sang mostly between '+midiToName(take.p15)+' and '+midiToName(take.p85)+', which is '+where+' of your full range.');
  if(song){
    let bs=0, be=Infinity;
    for(let s=-24;s<=24;s++){ const e=Math.abs(song.lo+s-take.p05)+Math.abs(song.hi+s-take.p95); if(e<be){ be=e; bs=s; } }
    lines.push('The original runs '+midiToName(song.lo)+' to '+midiToName(song.hi)+'. '+(be<=6 ? 'It sounds like you sang it '+(bs===0?'in the original key':shiftLabel(bs)+' from the original')+'.' : 'Your take covered a different span than the full original, so the key you chose is hard to pin down from this clip.'));
    const nat=naturalFit(song,prof), best=bestFit(song,prof);
    if(nat.over===0) lines.push('At the original pitch'+(nat.s? ' ('+shiftLabel(nat.s)+')':'')+' the whole song fits inside your measured range.');
    else lines.push('At the original pitch it reaches '+nat.over+' half step'+(nat.over===1?'':'s')+' past your measured range. Its best key for you is '+shiftLabel(best.s)+'.');
    lines.push('It is a '+(song.energy==='med'?'medium':song.energy)+'-energy '+song.genre+' song with a '+tagPhrase(song.tags)+'. Reaching for it suggests you are drawn to that kind of tone.'+
      (!isNaN(prof.bright)? ' Your own voice measured '+brightLabel(prof.bright)+' and '+airLabel(prof.air)+'.' : ''));
  } else if(title){
    lines.push('"'+title+'" is not in the song list yet, so there is no original range to compare. Add it on the Songs tab and this section will fill in next session.');
  }
  return lines.join(' ');
}

// ---- Growth tips ------------------------------------------------------------------
function growthTips(p){
  const tips=[];
  if(p.air>0.33) tips.push({t:'Cleaner starts to notes', d:'Your tone measured airy. Say a gentle "uh-oh," feel the tiny click at the start of each sound, then sing "uh" on one easy note five times with that same clean start. Keep it quiet, not pushed.'});
  if(p.steadyCents>=18) tips.push({t:'Steadier held notes', d:'Held notes drifted about '+Math.round(p.steadyCents)+' cents. Hum through a drinking straw on one note for 10 seconds, three times, keeping the air slow and even. Then hold the same note on "oo" while watching the tuner line stay flat.'});
  if(p.signedCents<=-12) tips.push({t:'Landing notes a touch higher', d:'Notes tended to sit a little flat (about '+Math.abs(Math.round(p.signedCents))+' cents). Use the tuner: slide up into a note on "nee" from just below and stop when it reads "on." Repeat on five different notes.'});
  else if(p.signedCents>=12) tips.push({t:'Landing notes a touch lower', d:'Notes tended to sit a little sharp (about '+Math.round(p.signedCents)+' cents). Use the tuner: slide down into a note on "noh" from just above and stop when it reads "on." Repeat on five different notes.'});
  if(p.settleMs>=220) tips.push({t:'Finding the note sooner', d:'Notes took about '+Math.round(p.settleMs)+' ms to settle. Hear the note in your head first, then sing short "bah" notes on it, four in a row, aiming to land on pitch right away. The tuner shows how fast you settle.'});
  if(p.bright>0.33) tips.push({t:'Adding warmth', d:'Your tone measured bright. Start a yawn, keep that open feeling in your throat, and sigh down on "oh." Then sing a phrase you like on "oh" before adding the words back.'});
  else if(p.bright<-0.33) tips.push({t:'Adding sparkle', d:'Your tone measured warm. Sing a phrase on a bratty "nyah nyah" to bring the sound forward, then sing the real words and keep a little of that ring.'});
  if(!p.vibratoPresent && p.steadyCents<18) tips.push({t:'Optional: a little shimmer', d:'No regular vibrato showed up, which is a style choice. To explore it, hold a comfortable note and gently pulse the air "ha-ha-ha-ha" about five times a second, then smooth the pulses together.'});
  if((p.zhi-p.zlo) < 0.45*(p.high-p.low)) tips.push({t:'Using more of your range', d:'You have about '+(p.high-p.low)+' half steps of range but spent most of your singing in '+(p.zhi-p.zlo)+'. Glide on a lip trill from your lowest note to your highest and back, three times, to connect the whole range.'});
  tips.push({t:'Two-minute warm-up', d:'Before you sing: hum a slow slide from low to high and back three times, then sing "mum mum mum" up and down five notes. It gets the breath and voice working together before the big notes.'});
  return tips.slice(0,5);
}

// ---- Build a full profile from the three takes --------------------------------------
// passes are arrays of frames; song is a DB entry or null
function buildProfile(pass1, pass2, sing, song, songTitle, songArtist){
  const e1 = sustainedExtremes(toTrack(pass1),0.5);
  const e2 = pass2 && pass2.length? sustainedExtremes(toTrack(pass2),0.5) : null;
  const take = analyzeTake(sing);
  let low = e1? e1.low : NaN, high = e1? e1.high : NaN;
  let lowOk=false, highOk=false;
  if(e2){
    if(!isNaN(low)){ lowOk=Math.abs(e2.low-low)<=2; low=Math.min(low,e2.low); } else low=e2.low;
    if(!isNaN(high)){ highOk=Math.abs(e2.high-high)<=2; high=Math.max(high,e2.high); } else high=e2.high;
  }
  let extended=false;
  if(take.extremes){
    if(isNaN(low)||take.extremes.low<low-0.5){ low=take.extremes.low; extended=true; }
    if(isNaN(high)||take.extremes.high>high+0.5){ high=take.extremes.high; extended=true; }
  }
  if(isNaN(low)||isNaN(high)) return null;
  low=Math.round(low); high=Math.round(high);
  if(high-low<2) high=low+2;
  const notes=[];
  let zlo, zhi;
  const enoughSing = take.voicedSeconds>=5;
  if(enoughSing){ zlo=Math.round(take.p15); zhi=Math.round(take.p85); }
  else { zlo=Math.round(low+(high-low)*0.3); zhi=Math.round(low+(high-low)*0.7); notes.push('There was not enough clear singing in the free-sing step to measure your comfortable zone, so it is estimated from the middle of your range.'); }
  zlo=clamp(zlo,low,high); zhi=clamp(zhi,low,high); if(zhi-zlo<2){ zhi=Math.min(high,zlo+2); zlo=Math.max(low,zhi-2); }
  const vt = estimateVoiceType(low,high,zlo,zhi);
  const bright = brightScore(take.centroid,take.hf), air = airScore(take.hnr);
  if(take.dur<30) notes.push('The free-sing clip was '+Math.round(take.dur)+' seconds. Thirty or more gives steadier tone and accuracy numbers.');
  if(take.dur>0 && take.voicedRatio<0.3) notes.push('Only '+Math.round(take.voicedRatio*100)+'% of the clip had a clear sung pitch. Singing closer to the phone or a little louder will help.');
  if(take.meanRms>0 && take.meanRms<0.012) notes.push('The recording was quiet, so tone readings (warm/bright, airy/clear) are less certain.');
  if(take.noise>0.01) notes.push('There was steady background noise in the room, which can blur the airy/clear reading.');
  if(take.heldNotes<6) notes.push('Only '+take.heldNotes+' held notes were found, so accuracy, steadiness and vibrato are rough readings.');
  if(e2 && !lowOk) notes.push('Your lowest note was only reached once across the two range passes, so treat the bottom of your range as approximate.');
  if(e2 && !highOk) notes.push('Your highest note was only reached once across the two range passes, so treat the top of your range as approximate.');
  if(extended) notes.push('You went past your range-check notes while free singing, so the range was widened to include them.');
  const prof = {
    date: new Date().toISOString(),
    low:low, high:high, zlo:zlo, zhi:zhi, lowOk:lowOk, highOk:highOk,
    voiceType: vt.name, voiceReason: vt.reason,
    bright: bright, air: air, centroid: take.centroid, hf: take.hf, hnr: take.hnr,
    steadyCents: take.steadyCents,
    vibratoPresent: take.vibrato.present, vibratoRate: take.vibrato.rate, vibratoExtent: take.vibrato.extent,
    accCents: take.accCents, signedCents: take.signedCents, settleMs: take.settleMs, heldNotes: take.heldNotes,
    singSeconds: take.dur, voicedRatio: take.voicedRatio,
    songTitle: songTitle||'', songArtist: songArtist||'',
    notes: notes
  };
  prof.songInsight = songChoiceInsight(prof, take, song, songTitle);
  return prof;
}
function profileText(p){
  const L=[];
  L.push('MY VOICE PROFILE ('+new Date(p.date).toLocaleDateString()+')');
  L.push('Full range: '+midiToName(p.low)+' to '+midiToName(p.high)+' ('+(p.high-p.low)+' half steps)');
  L.push('Comfortable zone: '+midiToName(p.zlo)+' to '+midiToName(p.zhi));
  L.push('Likely voice type (estimate): '+p.voiceType);
  L.push('Tone: '+brightLabel(p.bright)+'; '+airLabel(p.air)+'; '+steadyLabel(p.steadyCents)+'; vibrato '+(p.vibratoPresent? 'yes, about '+p.vibratoRate.toFixed(1)+' Hz, +/-'+Math.round(p.vibratoExtent)+' cents':'not detected'));
  if(!isNaN(p.accCents)) L.push('Pitch: on average '+Math.round(p.accCents)+' cents from the nearest note'+(Math.abs(p.signedCents)>=8?(p.signedCents<0?' (tends flat)':' (tends sharp)'):'')+(isNaN(p.settleMs)?'':'; settles onto notes in about '+Math.round(p.settleMs)+' ms'));
  if(p.songTitle) L.push('Song I chose to sing: '+p.songTitle+(p.songArtist?' by '+p.songArtist:''));
  if(p.songInsight) L.push('What that showed: '+p.songInsight);
  L.push('Measured on my phone with a pitch-detection app; voice type and tone are estimates.');
  L.push('Please suggest songs that fit this voice, with the best key for each.');
  return L.join('\n');
}

    }catch(e){ try{ ctx.close(); }catch(_){} this.ctx=null; throw e; }
    if(resume) try{ await resume; }catch(_){}
    this.stream = stream; this.sr = ctx.sampleRate; this.total=0; this.trail=[]; this.last=null; this.ring.fill(0);
    const src = ctx.createMediaStreamSource(stream);
    const mute = ctx.createGain(); mute.gain.value = 0;
    if(ctx.createScriptProcessor){
      const proc = ctx.createScriptProcessor(HOP,1,1);
      proc.onaudioprocess = e => this.feed(e.inputBuffer.getChannelData(0));
      src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
      this.nodes=[src,proc,mute];
    } else {
      const an = ctx.createAnalyser(); an.fftSize = WIN; src.connect(an);
      const buf = new Float32Array(WIN), bytes = new Uint8Array(WIN);
      this.timer = setInterval(()=>{
        if(an.getFloatTimeDomainData) an.getFloatTimeDomainData(buf); else { an.getByteTimeDomainData(bytes); for(let i=0;i<WIN;i++) buf[i]=(bytes[i]-128)/128; }
        this.frame(buf, ctx.currentTime);
      }, 22);
      this.nodes=[src,an];
    }
    this.on = true;
    try{ if(navigator.wakeLock) this.wake = await navigator.wakeLock.request('screen'); }catch(_){}
  },
  feed(input){
    const L=input.length, r=this.ring;
    if(L>=WIN) r.set(input.subarray(L-WIN)); else { r.copyWithin(0,L); r.set(input, WIN-L); }
    this.total += L;
    if(this.total>=WIN) this.frame(r, this.total/this.sr);
  },
  frame(buf, t){
    const fr = analyzeFrame(buf, this.sr); fr.t = t;
    if(fr.conf<0.5) this.noise = 0.95*this.noise + 0.05*fr.rms;
    fr.v = fr.f>0 && fr.conf>=0.8 && fr.rms>Math.max(0.004, this.noise*2.5);
    this.last = fr;
    this.trail.push({t:t, m: fr.v? hzToMidi(fr.f) : NaN});
    if(this.trail.length>600) this.trail.splice(0,this.trail.length-600);
    if(this.rec) this.rec.push({t:fr.t, rms:fr.rms, f:fr.f, conf:fr.conf, hnr:fr.hnr, centroid:fr.centroid, hf:fr.hf});
  },
  stop(){
    this.rec=null; this.on=false;
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    for(const n of this.nodes){ try{ n.disconnect(); }catch(_){} if(n.onaudioprocess) n.onaudioprocess=null; }
    this.nodes=[];
    if(this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; }
    if(this.ctx){ try{ this.ctx.close(); }catch(_){} this.ctx=null; }
    if(this.wake){ try{ this.wake.release(); }catch(_){} this.wake=null; }
  }
};

function micMessage(e){
  const n = e && e.name || '';
  if(n==='NotAllowedError'||n==='SecurityError'||n==='PermissionDeniedError') return ['The microphone is blocked','This app can only hear you if you allow the microphone. Tap the button below and choose Allow. If no prompt shows up, open Settings, then Safari (under Apps on newer iPhones), then Microphone, and set it to Ask or Allow. Then come back and try again. Nothing you sing is uploaded or saved; only the results stay on this phone.'];
  if(n==='NotFoundError'||n==='DevicesNotFoundError') return ['No microphone found','This device did not report a microphone. If headphones are connected, disconnect them and try again.'];
  if(n==='NotReadableError') return ['The microphone is busy','Another app is using the microphone (a call, a recording, or voice control). Close it and try again.'];
  if(n==='Insecure') return ['This page needs a secure link','Safari only allows the microphone on https pages. Open the app from its GitHub Pages address (it starts with https://), not from a file.'];
  if(n==='Unsupported') return ['This browser cannot use the microphone here','Open the page in Safari on your iPhone (iOS 14.5 or newer), or update iOS.'];
  if(n==='Paused') return ['Session paused','The app went to the background, so the microphone was turned off. Start again when you are ready.'];
  return ['The microphone did not start','Something went wrong ('+esc(n||'unknown')+'). Close other apps that use the microphone and try again.'];
}

// ---- live tuner drawing -------------------------------------------------------
let raf=0, viewCenter=57;
function tunerHTML(){ return '<div class="tuner"><div class="note" id="tNote"><small>sing</small></div><div class="cents" id="tCents">&nbsp;</div><div class="needle"><i id="tNeedle"></i></div><div class="pill" id="tPill">listening</div></div><canvas class="pitch" id="tCanvas"></canvas>'; }
function startTunerLoop(extra){
  cancelAnimationFrame(raf);
  const cv=$('#tCanvas'); if(!cv) return;
  const cx=cv.getContext('2d'); let lastTxt=0;
  function loop(now){
    if(!document.body.contains(cv)) return;
    raf=requestAnimationFrame(loop);
    const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
    if(cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
    cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,w,h);
    const tr=Mic.trail, tNow=tr.length? tr[tr.length-1].t : 0, span=8, half=11;
    const recent=[]; for(let i=tr.length-1;i>=0 && tNow-tr[i].t<1.2;i--) if(!isNaN(tr[i].m)) recent.push(tr[i].m);
    if(recent.length>3){ const md=median(recent); viewCenter += (md-viewCenter)*0.06; }
    const y = m => h/2 - (m-viewCenter)*(h/(2*half));
    cx.font='11px system-ui'; cx.textBaseline='middle';
    for(let m=Math.ceil(viewCenter-half); m<=viewCenter+half; m++){
      const nat = [0,2,4,5,7,9,11].indexOf(((m%12)+12)%12)>=0;
      cx.strokeStyle = nat? 'rgba(255,255,255,.10)':'rgba(255,255,255,.04)'; cx.lineWidth=1;
      cx.beginPath(); cx.moveTo(34,y(m)); cx.lineTo(w,y(m)); cx.stroke();
      if(nat && [5,11].indexOf(((m%12)+12)%12)<0){ cx.fillStyle='rgba(165,155,176,.9)'; cx.fillText(midiToName(m),6,y(m)); }
    }
    if(extra && extra.marks){ for(const mk of extra.marks()){ cx.strokeStyle=mk.c; cx.setLineDash([6,6]); cx.lineWidth=2; cx.beginPath(); cx.moveTo(34,y(mk.m)); cx.lineTo(w,y(mk.m)); cx.stroke(); cx.setLineDash([]); } }
    const x = t => 34 + (w-46)*(1-(tNow-t)/span);
    cx.lineWidth=3.5; cx.lineJoin='round'; cx.lineCap='round'; cx.strokeStyle='#ff8fa3';
    let pen=false, pt=0; cx.beginPath();
    for(const p of tr){
      if(tNow-p.t>span) continue;
      if(isNaN(p.m)){ if(p.t-pt>0.15) pen=false; continue; }
      if(!pen || p.t-pt>0.15){ cx.moveTo(x(p.t),y(p.m)); pen=true; } else cx.lineTo(x(p.t),y(p.m));
      pt=p.t;
    }
    cx.stroke();
    const lastP = tr.length? tr[tr.length-1] : null;
    if(lastP && !isNaN(lastP.m)){ cx.fillStyle='#ffd0b3'; cx.beginPath(); cx.arc(x(lastP.t),y(lastP.m),6,0,7); cx.fill(); }
    if(now-lastTxt>70){
      lastTxt=now;
      const live=[]; for(let i=tr.length-1;i>=0 && tNow-tr[i].t<0.14;i--) if(!isNaN(tr[i].m)) live.push(tr[i].m);
      const nEl=$('#tNote'), cEl=$('#tCents'), pEl=$('#tPill'), ndl=$('#tNeedle');
      if(live.length>=2){
        const m=median(live), near=Math.round(m), c=Math.round((m-near)*100), nm=midiToName(near);
        nEl.innerHTML=esc(nm.replace(/-?\d+$/,''))+'<small>'+esc(nm.match(/-?\d+$/)[0])+'</small>';
        cEl.textContent=(c>0?'+':'')+c+' cents';
        ndl.style.left=(50+c)+'%';
        pEl.className='pill '+(Math.abs(c)<=15?'on':c<0?'flat':'sharp'); pEl.textContent=Math.abs(c)<=15?'ON':c<0?'FLAT':'SHARP';
      } else if(tNow && (!lastP || isNaN(lastP.m))){
        const quiet=[]; for(let i=tr.length-1;i>=0 && tNow-tr[i].t<0.5;i--) if(!isNaN(tr[i].m)) quiet.push(1);
        if(!quiet.length){ nEl.innerHTML='<small>sing</small>'; cEl.innerHTML='&nbsp;'; pEl.className='pill'; pEl.textContent='listening'; ndl.style.left='50%'; }
      }
      if(extra && extra.tick) extra.tick();
    }
  }
  raf=requestAnimationFrame(loop);
}

  }

      (first? '<h1>Slide low to high, then back</h1><div class="card"><ol class="steps"><li>Start on your <b>lowest comfortable note</b> and hold it for a second.</li><li>Slide up <b>slowly</b> on "ah" or "oo" to your <b>highest comfortable note</b>. Hold it for a second.</li><li>Slide back down.</li></ol><p class="small mute" style="margin-top:8px">Comfortable means no strain. A note only counts if you hold it for half a second, so a quick squeak will not change your range.</p></div>'
            : '<h1>Quick confirm</h1><div class="card"><p>Hold your <b>lowest</b> note for two seconds. Then hold your <b>highest</b> note for two seconds. The dashed lines show what you reached the first time.</p></div>')+
      tunerHTML()+

      '<p class="small mute" id="rMsg" style="min-height:22px;margin-top:8px"></p>'+

async function begin(step){
  S.micErr=null;

  catch(e){ S.micErr=e||{name:'Error'}; S.step='home'; render(); return; }
  S.step=step; render(); window.scrollTo(0,0);
}
function cancelSession(){ Mic.stop(); S.step='home'; render(); window.scrollTo(0,0); }
function finishSession(){
  Mic.stop();
  const song = findSong(allSongs(), S.songTitle, S.songArtist);
  let prof=null;
  try{ prof = buildProfile(S.p1, S.p2, S.sing, song, S.songTitle, S.songArtist); }catch(e){ prof=null; }
  S.step='home';
  if(!prof){ S.micErr={name:'Empty'}; view.innerHTML='<h1>That take was too quiet to read</h1><p class="mute">No clear held notes came through. Try again a little closer to the phone, in a quieter spot.</p><button class="btn" id="again">Back to start</button>'; $('#again').onclick=()=>{ S.micErr=null; render(); }; return; }
  sessions.push(prof); if(sessions.length>60) sessions=sessions.slice(-60);

  setTab('profile');
}

// ---------- PROFILE ----------
function pianoSVG(p){
  const start=Math.floor(Math.min(36,p.low-1)/12)*12, end=Math.ceil(Math.max(84,p.high+1)/12)*12;
  const isB = m => [1,3,6,8,10].indexOf(((m%12)+12)%12)>=0;
  let whites=0; for(let m=start;m<=end;m++) if(!isB(m)) whites++;
  const W=340, H=92, kw=W/whites; let x=0, wh='', bl='', lab=''; const cxOf={};
  const col = (m,black)=>{ const z=m>=p.zlo&&m<=p.zhi, r=m>=p.low&&m<=p.high;
    return black? (z?'#c2385a':r?'#b7744f':'#0d0a11') : (z?'#ff6f91':r?'#ffc9a8':'#2e2738'); };
  for(let m=start;m<=end;m++){
    if(isB(m)){ cxOf[m]=x; bl+='<rect x="'+(x-kw*0.3).toFixed(2)+'" y="18" width="'+(kw*0.6).toFixed(2)+'" height="38" rx="1.5" fill="'+col(m,true)+'" stroke="#120f16" stroke-width=".6"/>'; }
    else { cxOf[m]=x+kw/2; wh+='<rect x="'+x.toFixed(2)+'" y="18" width="'+(kw-0.8).toFixed(2)+'" height="60" rx="2" fill="'+col(m,false)+'"/>';
      if(m%12===0) lab+='<text x="'+(x+kw/2).toFixed(2)+'" y="90" font-size="8.5" fill="#a59bb0" text-anchor="middle">'+midiToName(m)+'</text>';
      x+=kw; }
  }
  for(const m of [p.low,p.high]) lab+='<text x="'+clamp(cxOf[m],12,W-12).toFixed(2)+'" y="11" font-size="11" font-weight="700" fill="#ffb38a" text-anchor="middle">'+midiToName(m)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Piano strip showing your range '+esc(noteSpan(p.low,p.high))+'">'+wh+bl+lab+'</svg>';
}
function scaleHTML(l,r,v,label){ const ok=!isNaN(v); return '<div class="scale"><div class="ends"><span>'+l+'</span><span>'+r+'</span></div><div class="track">'+(ok?'<i style="left:'+(50+clamp(v,-1,1)*46)+'%"></i>':'')+'</div><div class="val">'+esc(label)+'</div></div>'; }

  view.innerHTML = '<div class="eyebrow">Your voice · '+new Date(p.date).toLocaleDateString()+'</div><h1>Your voice, as it is</h1>'+

    '<div class="card"><h3>Likely voice type</h3><div class="big" style="text-transform:capitalize">'+esc(p.voiceType)+'</div><p class="mute small">'+esc(p.voiceReason)+' This is an estimate from one session. Voice type also depends on tone and where your voice changes gear, which a teacher would listen for.</p></div>'+
    '<div class="card"><h3>Tone</h3>'+scaleHTML('Warm','Bright',p.bright,'Your tone reads as '+brightLabel(p.bright)+'.')+scaleHTML('Clear','Airy',p.air,'Your sound is '+airLabel(p.air)+'.')+scaleHTML('Steady','Wavering',steadyV, isNaN(p.steadyCents)?'Not enough held notes to tell.':'Held notes are '+steadyLabel(p.steadyCents)+' (about '+Math.round(p.steadyCents)+' cents of drift).')+
      '<div class="kv" style="margin-top:12px;border-top:1px solid var(--line)"><span>Vibrato</span><span>'+(p.vibratoPresent? 'Yes · '+p.vibratoRate.toFixed(1)+' per second · ±'+Math.round(p.vibratoExtent)+' cents':'Not detected (a straight tone)')+'</span></div></div>'+
    '<div class="card"><h3>Pitch accuracy</h3>'+acc+'</div>'+
    '<div class="card"><h3>What your song choice says</h3>'+(p.songTitle?'<p><b>'+esc(p.songTitle)+'</b>'+(p.songArtist?' <span class="mute">· '+esc(p.songArtist)+'</span>':'')+'</p>':'')+'<p class="mute">'+esc(p.songInsight||'')+'</p></div>'+
    (p.notes&&p.notes.length? '<div class="card soft"><h3>How sure is this read?</h3>'+p.notes.map(n=>'<p class="small">'+esc(n)+'</p>').join('')+'</div>':'')+
    '<button class="btn" id="toMatch">See songs that fit my voice</button>'+
    '<h2>Ways to grow</h2><div class="card">'+tips+'</div>'+
    '<button class="btn ghost" id="copy">Copy my voice profile</button><p class="small mute center">Copies a text summary you can paste into Claude for more song ideas.</p>';
  $('#toMatch').onclick=()=>setTab('matches');
  $('#copy').onclick=()=>copyText(profileText(p));
}
function copyText(txt){
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); toast(ok?'Copied':'Copy did not work here'); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast('Copied'),fallback); else fallback();
}

// ---------- MATCHES ----------
function songCard(r, f, extra){
  const s=r.song, c=critique(s,f,latest()), src=SOURCES[s.src]||['',''];
  return '<details class="song"><summary><div class="fit" style="--p:'+Math.round(f.score*100)+'"><span>'+Math.round(f.score*100)+'</span></div><div style="min-width:0"><div class="ti">'+esc(s.title)+'</div><div class="ar">'+esc(s.artist)+'</div><div class="key">'+(extra? esc(extra) : (f.s===0?'Original key':esc(shiftLabel(f.s))))+'</div></div></summary>'+
    '<div class="body">'+(r.work? '<p><b>What to work on.</b> '+esc(r.work)+'</p>' : '<p><b>Why it suits you.</b> '+esc(c.why)+'</p><p><b>What will challenge you.</b> '+esc(c.hard)+'</p><p><b>Key.</b> '+esc(c.key)+'</p>')+
    '<p class="tags">Original: '+esc(midiToName(s.lo)+' to '+midiToName(s.hi))+' · '+esc(s.voice)+' · '+esc(s.genre)+' · '+(s.energy==='med'?'medium':esc(s.energy))+' energy · '+esc(s.tags.join(', '))+
    (src[0]? '<br>Range source: '+(src[1]?'<a href="'+esc(src[1])+'" target="_blank" rel="noopener">'+esc(src[0])+'</a>':esc(src[0]))+(s.raw?' (listed there as '+esc(s.raw)+'; octave adjusted to the singer\'s voice)':'') : '')+'</p></div></details>';
}
function renderMatches(){
  const p=latest();
  if(!p){ view.innerHTML='<div class="eyebrow">Matches</div><h1>Songs for your voice</h1><p class="mute">Once you have a profile, your best-fitting songs show up here with the right key for each.</p><button class="btn" id="go">Start a session</button>'; $('#go').onclick=()=>{ S.tab='sing'; render(); begin('range1'); }; return; }
  const all=allSongs(), ranked=rankSongs(all,p);
  const list=ranked.filter(r=>(S.genre==='All'||r.song.genre===S.genre)&&(S.energy==='All'||r.song.energy===S.energy));
  const stretch=stretchList(list,p,8);
  const gs=['All'].concat(GENRES.filter(g=>all.some(s=>s.genre===g)));
  view.innerHTML='<div class="eyebrow">Matches · '+esc(noteSpan(p.low,p.high))+'</div><h1>Songs that fit your voice</h1><p class="mute small">Scored on how the song\'s range fits inside yours, how its main zone overlaps your comfortable zone, and how close its sound is to your tone. Each song is scored in its best key for you.</p>'+
    '<div class="row"><div><label class="f" for="fG">Genre</label><select id="fG">'+gs.map(g=>'<option'+(g===S.genre?' selected':'')+'>'+esc(g)+'</option>').join('')+'</select></div><div><label class="f" for="fE">Energy</label><select id="fE">'+[['All','All'],['low','Low'],['med','Medium'],['high','High']].map(e=>'<option value="'+e[0]+'"'+(e[0]===S.energy?' selected':'')+'>'+e[1]+'</option>').join('')+'</select></div></div>'+
    '<h2>Top matches</h2>'+(list.length? list.slice(0,S.show).map(r=>songCard(r,r.fit)).join('') : '<p class="mute">No songs with those filters.</p>')+
    (list.length>S.show? '<button class="btn ghost" id="more">Show more ('+(list.length-S.show)+' left)</button>':'')+
    '<h2>Stretch songs</h2><p class="mute small">In the original key these go 1 to 4 half steps past your current range. They are good targets to grow toward.</p>'+
    (stretch.length? stretch.map(r=>songCard(r,r.fit,(r.fit.s? shiftLabel(r.fit.s)+' · ':'')+r.fit.over+' half step'+(r.fit.over===1?'':'s')+' past your range')).join('') : '<p class="mute">Nothing in that band with these filters.</p>')+
    '<p class="small mute center" style="margin-top:18px">'+all.length+' songs in your list. Add more on the Songs tab.</p>';
  $('#fG').onchange=e=>{ S.genre=e.target.value; S.show=20; renderMatches(); };
  $('#fE').onchange=e=>{ S.energy=e.target.value; S.show=20; renderMatches(); };
  const m=$('#more'); if(m) m.onclick=()=>{ S.show+=20; const y=window.scrollY; renderMatches(); window.scrollTo(0,y); };
}

// ---------- PROGRESS ----------
function drawCharts(){
  const data=sessions.slice(-12); const dpr=window.devicePixelRatio||1;
  function prep(id){ const cv=$(id); if(!cv) return null; const w=cv.clientWidth,h=cv.clientHeight; cv.width=w*dpr; cv.height=h*dpr; const cx=cv.getContext('2d'); cx.setTransform(dpr,0,0,dpr,0,0); cx.font='11px system-ui'; cx.textBaseline='middle'; return {cx,w,h}; }
  const a=prep('#chRange');
  if(a){ const {cx,w,h}=a, padL=36,padB=22,padT=10;
    const lo=Math.min.apply(null,data.map(d=>d.low))-2, hi=Math.max.apply(null,data.map(d=>d.high))+2;
    const y=m=>padT+(h-padT-padB)*(1-(m-lo)/(hi-lo)), x=i=>padL+(w-padL-14)*(data.length===1?0.5:i/(data.length-1));
    for(let m=Math.ceil(lo);m<=hi;m++){ if(m%12===0||m%12===7){ cx.strokeStyle='rgba(255,255,255,.08)'; cx.beginPath(); cx.moveTo(padL,y(m)); cx.lineTo(w,y(m)); cx.stroke(); cx.fillStyle='#a59bb0'; cx.textAlign='left'; cx.fillText(midiToName(m),4,y(m)); } }
    cx.lineCap='round';
    data.forEach((d,i)=>{ cx.strokeStyle='#ffc9a8'; cx.lineWidth=4; cx.beginPath(); cx.moveTo(x(i),y(d.low)); cx.lineTo(x(i),y(d.high)); cx.stroke();
      cx.strokeStyle='#ff6f91'; cx.lineWidth=10; cx.beginPath(); cx.moveTo(x(i),y(d.zlo)); cx.lineTo(x(i),y(d.zhi)); cx.stroke();
      cx.fillStyle='#a59bb0'; cx.textAlign='center'; const dt=new Date(d.date); cx.fillText((dt.getMonth()+1)+'/'+dt.getDate(),x(i),h-9); });
  }
  const b=prep('#chAcc');
  if(b){ const {cx,w,h}=b, padL=36,padB=22,padT=10; const pts=data.map(d=>d.accCents);
    const mx=Math.max(30,Math.max.apply(null,pts.filter(v=>!isNaN(v)).concat([0]))+5);
    const y=v=>padT+(h-padT-padB)*(1-v/mx), x=i=>padL+(w-padL-14)*(data.length===1?0.5:i/(data.length-1));
    for(let v=0;v<=mx;v+=10){ cx.strokeStyle='rgba(255,255,255,.08)'; cx.beginPath(); cx.moveTo(padL,y(v)); cx.lineTo(w,y(v)); cx.stroke(); cx.fillStyle='#a59bb0'; cx.textAlign='left'; cx.fillText(v+'c',4,y(v)); }
    cx.strokeStyle='#7be0b5'; cx.lineWidth=3; cx.lineJoin='round'; cx.beginPath(); let pen=false;
    pts.forEach((v,i)=>{ if(isNaN(v)){ return; } if(pen) cx.lineTo(x(i),y(v)); else { cx.moveTo(x(i),y(v)); pen=true; } }); cx.stroke();
    pts.forEach((v,i)=>{ if(isNaN(v)) return; cx.fillStyle='#7be0b5'; cx.beginPath(); cx.arc(x(i),y(v),5,0,7); cx.fill(); cx.fillStyle='#a59bb0'; cx.textAlign='center'; const dt=new Date(data[i].date); cx.fillText((dt.getMonth()+1)+'/'+dt.getDate(),x(i),h-9); });
  }
}
function renderProgress(){
  if(!sessions.length){ view.innerHTML='<div class="eyebrow">Progress</div><h1>Your voice over time</h1><p class="mute">Every session is saved on this phone. After your first one, your range, comfortable zone and pitch closeness are charted here.</p>'; return; }
  view.innerHTML='<div class="eyebrow">Progress · '+sessions.length+' session'+(sessions.length===1?'':'s')+'</div><h1>Your voice over time</h1>'+
    '<div class="card"><h3>Range and comfortable zone</h3><canvas class="chart" id="chRange"></canvas><div class="legend"><span><i style="background:#ffc9a8"></i>Full range</span><span><i style="background:#ff6f91"></i>Comfortable zone</span></div></div>'+
    '<div class="card"><h3>Distance from the nearest note</h3><canvas class="chart" id="chAcc" style="height:180px"></canvas><p class="small mute">In cents (100 = one piano key). Lower means notes land closer to center.</p></div>'+
    '<h2>Sessions</h2>'+sessions.slice().reverse().map((d,i)=>{ const idx=sessions.length-1-i; return '<div class="card"><div class="row"><div><b>'+new Date(d.date).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+'</b><div class="small mute">'+esc(noteSpan(d.low,d.high))+' · zone '+esc(noteSpan(d.zlo,d.zhi))+(isNaN(d.accCents)?'':' · '+Math.round(d.accCents)+' cents')+(d.songTitle?'<br>Sang: '+esc(d.songTitle):'')+'</div></div><button class="btn ghost sm" style="flex:none" data-del="'+idx+'">Delete</button></div></div>'; }).join('');
  $$('[data-del]').forEach(b=>b.onclick=()=>{ if(confirm('Delete this session?')){ sessions.splice(+b.dataset.del,1); save(K_SESS,sessions); renderProgress(); } });
  drawCharts();
}

// ---------- SONGS (add your own) ----------
function renderSongs(){
  const noteOpts = sel => { let o=''; for(let m=36;m<=96;m++) o+='<option value="'+m+'"'+(m===sel?' selected':'')+'>'+midiToName(m)+'</option>'; return o; };
  const srcList = Object.keys(SOURCES).filter(k=>k!=='you').map(k=>'<li><a href="'+esc(SOURCES[k][1])+'" target="_blank" rel="noopener">'+esc(SOURCES[k][0])+'</a></li>').join('');
  view.innerHTML='<div class="eyebrow">Songs</div><h1>Add a song</h1><p class="mute">Know a song\'s lowest and highest note? Add it and it joins your matches. C4 is middle C.</p>'+
    '<div class="card"><label class="f" for="aT">Title</label><input type="text" id="aT" autocomplete="off"><label class="f" for="aA">Artist</label><input type="text" id="aA" autocomplete="off">'+
    '<div class="row"><div><label class="f" for="aL">Lowest note</label><select id="aL">'+noteOpts(55)+'</select></div><div><label class="f" for="aH">Highest note</label><select id="aH">'+noteOpts(72)+'</select></div></div>'+
    '<div class="row"><div><label class="f" for="aV">Original singer</label><select id="aV">'+VOICES.map(v=>'<option'+(v==='tenor'?' selected':'')+'>'+v+'</option>').join('')+'</select></div><div><label class="f" for="aE">Energy</label><select id="aE"><option value="low">Low</option><option value="med" selected>Medium</option><option value="high">High</option></select></div></div>'+
    '<label class="f" for="aG">Genre</label><select id="aG">'+GENRES.map(g=>'<option>'+esc(g)+'</option>').join('')+'</select>'+
    '<label class="f">How the original sounds</label><div class="chips" id="aTags">'+TAGS.map(t=>'<label class="chk"><input type="checkbox" value="'+t+'">'+t+'</label>').join('')+'</div>'+
    '<p class="small" id="aMsg" style="color:var(--amber);min-height:20px;margin-top:10px"></p><button class="btn" id="aSave">Add song</button></div>'+
    '<h2>Your added songs</h2>'+(customRows.length? customRows.map((r,i)=>'<div class="card"><div class="row"><div><b>'+esc(r[0])+'</b><div class="small mute">'+esc(r[1])+' · '+esc(r[3])+' to '+esc(r[4])+' · '+esc(r[8])+'</div></div><button class="btn ghost sm" style="flex:none" data-rm="'+i+'">Remove</button></div></div>').join('') : '<p class="mute">None yet.</p>')+
    '<h2>Built-in list</h2><p class="mute small">'+SONG_DB.length+' songs, each with a lowest and highest note found on a public source. Where a source wrote a range in a different octave than the singer sings it, the octave was adjusted and the song\'s card shows the original listing. Comfortable zones and tone tags are estimates.</p><details class="card"><summary style="cursor:pointer;font-weight:600">Sources</summary><ul class="small" style="padding-left:18px">'+srcList+'</ul></details>';
  $$('#aTags .chk').forEach(l=>l.onclick=e=>{ if(e.target.tagName==='INPUT') l.classList.toggle('sel',e.target.checked); });
  $('#aSave').onclick=()=>{
    const t=$('#aT').value.trim(), a=$('#aA').value.trim(), lo=+$('#aL').value, hi=+$('#aH').value, msg=$('#aMsg');
    if(!t){ msg.textContent='Add a title.'; return; } if(hi<=lo){ msg.textContent='The highest note needs to be above the lowest note.'; return; }
    const tags=$$('#aTags input:checked').map(i=>i.value); const span=hi-lo;
    customRows.push([t,a||'Unknown',$('#aV').value,midiToName(lo),midiToName(hi),midiToName(lo+Math.round(span*0.25))+'-'+midiToName(lo+Math.round(span*0.75)),tags.join(','),$('#aE').value,$('#aG').value,'you',null,true]);
    save(K_SONGS,customRows); toast('Added'); renderSongs();
  };
  $$('[data-rm]').forEach(b=>b.onclick=()=>{ customRows.splice(+b.dataset.rm,1); save(K_SONGS,customRows); renderSongs(); });
}
